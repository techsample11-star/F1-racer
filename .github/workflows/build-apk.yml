name: Build HTML to APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Build
        run: |
          cordova create myapp com.example.myapp "F1-Racer"
          rm -rf myapp/www/*
          cp -r index.html myapp/www/ || true
          # Copy external assets if present
          cd myapp
          cordova platform add android
          cordova build android --debug && mv platforms/android/app/build/outputs/apk/debug/app-debug.apk platforms/android/app/build/outputs/apk/debug/f1-racer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: myapp/platforms/android/app/build/outputs/apk/debug/f1-racer.apk
